services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod

  sitoprova-django-web:
    build: .
    container_name: django-docker
    depends_on:
      - db
    volumes:
      - staticfiles:/app/staticfiles
    env_file:
      - .env.prod

  sitoprova-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
      - ./landing:/app/landing:ro
    depends_on:
      - sitoprova-django-web
volumes:
  postgres_data:
  staticfiles:
